name: Deploy Todo Backend to Hugging Face

on:
  push:
    branches:
      - main
      - 002-fullstack-web
    paths:
      - 'backend/**'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout code
      - uses: actions/checkout@v4

      # 2) Build & push to Hugging Face Space
      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: "wahibakhan"
          HF_SPACE_NAME: "Todo_backend"
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "CI Bot"

          # Clone the space repo
          git clone https://huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME hf

          # Copy ONLY backend code into hf dir (not entire project)
          cp -r ./backend/* hf/

          cd hf

          # Commit & push to Space
          git add .
          git commit -m "Auto deploy from GitHub" || echo "No changes to commit"
          git push https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main

      - name: Deployment Summary
        run: |
          echo "## 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Space URL:** https://huggingface.co/spaces/wahibakhan/Todo_backend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** https://wahibakhan-todo-backend.hf.space" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API Docs:** https://wahibakhan-todo-backend.hf.space/docs" >> $GITHUB_STEP_SUMMARY
