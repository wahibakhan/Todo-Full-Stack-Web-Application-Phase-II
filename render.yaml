services:
  - type: web
    name: todo-backend
    env: python
    region: oregon
    plan: free
    branch: 002-fullstack-web
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["http://localhost:3001"]'
    healthCheckPath: /
